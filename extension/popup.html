<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NF Auto Profile</title>
    <link rel="stylesheet" href="popup.css">
    <script src="storage.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1><span class="brand">NF</span> Auto Profile</h1>
        <label class="toggle" title="Auto-select profile">
          <span id="enabled-label">Off</span>
          <input id="enabled" type="checkbox" role="switch" aria-label="Automatically select my profile" disabled>
          <span class="toggle-track" aria-hidden="true"></span>
        </label>
      </header>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>

      <form id="setup" novalidate>
        <div class="field-heading">
          <label for="profile">Profile</label>
          <button id="refresh" type="button" class="icon-button" aria-label="Refresh profiles" title="Refresh profiles">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 9a7.5 7.5 0 1 0 .2 6M19 4v5h-5"/></svg>
          </button>
        </div>
        <div class="profile-field">
          <span class="profile-avatar" aria-hidden="true">
            <svg id="avatar-placeholder" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>
            <img id="profile-avatar" alt="" referrerpolicy="no-referrer" hidden>
          </span>
          <select id="profile" aria-describedby="profile-help" disabled>
            <option value="">Choose a profile</option>
          </select>
        </div>
        <p id="profile-help" class="field-help" hidden></p>

        <div id="pin-section" hidden>
          <div class="field-heading pin-heading">
            <label for="pin">PIN</label>
          </div>
          <div class="pin-field">
            <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="4 digits" disabled>
            <button id="show-pin" type="button" class="icon-button reveal" aria-label="Show typed PIN" title="Show typed PIN" aria-pressed="false" disabled>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="m4 3 16 18"/></svg>
            </button>
          </div>
        </div>

        <p id="error" class="error" role="alert" hidden></p>
        <button id="save" type="submit" class="primary" disabled>Save</button>
      </form>

      <footer>
        <div class="footer-actions">
          <button id="open-netflix" type="button" class="text-button">Open Netflix <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button>
          <button id="forget" type="button" class="text-button" hidden>Forget profile</button>
        </div>
        <div class="footer-meta">
          <p class="disclaimer">Not affiliated with Netflix.</p>
          <div id="pause-controls" class="pause-controls" hidden>
            <span id="pause-time" role="timer" aria-live="off" hidden></span>
            <button id="pause-automation" type="button" class="text-button">Pause 10 min</button>
          </div>
        </div>
        <div id="forget-confirmation" class="forget-confirmation" hidden>
          <p>Forget this profile and PIN?</p>
          <div class="confirm-actions">
            <button id="cancel-forget" type="button" class="secondary">Cancel</button>
            <button id="confirm-forget" type="button" class="danger">Forget</button>
          </div>
        </div>
      </footer>
    </main>
  </body>
</html>
